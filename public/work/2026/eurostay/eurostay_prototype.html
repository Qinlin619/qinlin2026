<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroStay App Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #7A63C7; 
            --primary-light: #D2C8FD;
            --accent: #FFD35E;
            --accent-light: #FFEDBE;
            --red: #FF5E5E;
            --text-main: #333333;
            --text-muted: #9B9B9B;
            --bg-app: #E9E9E9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-subtle: 0 4px 20px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Device Frame */
        .device-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .device-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 12px solid #000;
            border-radius: 40px;
            pointer-events: none;
            z-index: 9999;
        }
 
        .device-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Top Status Bar (Overlay) */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dynamic-island {
            width: 110px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 7px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 12px;
        }

        .dynamic-island.expanded {
            width: 320px;
            height: 64px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .island-content {
            color: white;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            justify-content: center;
        }

        .dynamic-island.expanded .island-content {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .island-title {
            font-weight: 700;
            font-size: 13px;
        }

        .island-desc {
            font-size: 11px;
            opacity: 0.8;
        }

        /* Screens Container */
        .screens {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .screen.active {
            display: flex;
            z-index: 1;
        }

        /* Smooth Transition Classes */
        .screen.transitioning {
            display: flex !important;
            pointer-events: none;
        }

        .screen.slide-in {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
        }

        .screen.slide-out {
            animation: slideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 1;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @keyframes slideOut {
            from { transform: translateX(0); }
            to { transform: translateX(-30%); }
        }

        /* Hotspots */
        .hotspot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            z-index: 10;
        }

        /* Guide Pulse Animation for Hotspots when clicking wrong area */
        .hotspot.pulse-hint {
            border: 2px dashed var(--primary);
            background: rgba(122, 99, 199, 0.15);
            animation: pulse 1s ease infinite;
            border-radius: 8px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(122, 99, 199, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(122, 99, 199, 0); }
            100% { box-shadow: 0 0 0 0 rgba(122, 99, 199, 0); }
        }

        /* Error/Generic Click Overlay to trigger hints */
        .click-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

    </style>
</head>
<body>

<div class="device-frame">
    <div class="device-screen">
        <!-- Top Status Bar (Overlay for Dynamic Island) -->
        <div class="status-bar">
            <div class="dynamic-island" id="island" style="pointer-events: auto;">
                <div class="island-content" id="island-content">
                    <i class="fas fa-check-circle" style="color: #4ADE80; font-size: 20px;"></i>
                    <div style="display: flex; flex-direction: column; text-align: left;">
                        <span class="island-title">申请提交成功</span>
                        <span class="island-desc">已成功发送换宿申请给 Host Sherry!</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- App Screens -->
        <div class="screens" id="screens-container" onclick="handleScreenClick()" style="cursor: pointer;">
            <!-- SCREEN 1: Onboarding Guide -->
            <div id="screen-1" class="screen active" data-step="1">
                <img src="app/1.png" alt="Welcome Onboarding">
            </div>

            <!-- SCREEN 2: Search/Discovery Guide -->
            <div id="screen-2" class="screen" data-step="2">
                <img src="app/2.png" alt="Search Guide">
            </div>

            <!-- SCREEN 3: Discover & Filter Sheet -->
            <div id="screen-3" class="screen" data-step="3">
                <img src="app/3.png" alt="Location Filter">
            </div>

            <!-- SCREEN 4: Search Results & Hosts -->
            <div id="screen-4" class="screen" data-step="4">
                <img src="app/4.png" alt="Host List">
            </div>

            <!-- SCREEN 5: Host Profile Details -->
            <div id="screen-5" class="screen" data-step="5">
                <img src="app/5.png" alt="Host Sherry Profile">
            </div>

            <!-- SCREEN 6: Booking Request Form -->
            <div id="screen-6" class="screen" data-step="6">
                <img src="app/6.png" alt="Submit Application">
            </div>

            <!-- SCREEN 7: Booking History list -->
            <div id="screen-7" class="screen" data-step="7">
                <img src="app/7.png" alt="My Bookings">
            </div>

            <!-- SCREEN 8: Chats List -->
            <div id="screen-8" class="screen" data-step="8">
                <img src="app/8.png" alt="Messages Inbox">
            </div>
        </div>
    </div>
</div>

<script>
    let activeStep = 1;
    let transitionInProgress = false;

    function handleScreenClick() {
        if (transitionInProgress) return;
        
        let nextStepNum = (activeStep % 8) + 1;
        
        if (activeStep === 6) {
            // Show success notification in Dynamic Island
            const island = document.getElementById('island');
            island.classList.add('expanded');
            
            // Go to Screen 7
            performTransition(7);
            
            setTimeout(() => {
                island.classList.remove('expanded');
            }, 2500);
        } else {
            performTransition(nextStepNum);
        }
    }

    function performTransition(stepNum) {
        if (transitionInProgress) return;
        transitionInProgress = true;

        const currentScreen = document.getElementById(`screen-${activeStep}`);
        const nextScreen = document.getElementById(`screen-${stepNum}`);

        currentScreen.className = 'screen transitioning slide-out';
        nextScreen.className = 'screen transitioning slide-in active';

        setTimeout(() => {
            currentScreen.className = 'screen';
            nextScreen.className = 'screen active';
            activeStep = stepNum;
            transitionInProgress = false;
        }, 300);
    }
</script>
</body>
</html>
