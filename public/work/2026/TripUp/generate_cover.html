<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripUp Cover Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 1000px;
            height: 1000px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 100px;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .left-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-right: 40px;
        }
        .svg-branding {
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
        }
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 84px;
            color: #0f172a;
            margin: 0 0 10px 0;
            letter-spacing: -0.04em;
            line-height: 1;
        }
        .subtitle {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 32px;
            color: #64748b;
            margin: 0;
            letter-spacing: -0.02em;
        }
        .right-col {
            width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phone-wrapper {
            width: 380px;
            height: 770px;
            overflow: hidden;
            position: relative;
            border-radius: 48px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
            background: #ffffff;
        }
        .phone-img {
            position: absolute;
            top: -340px;
            left: -190px;
            width: 1820px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="left-col">
        <svg viewBox="0 0 100 100" class="svg-branding" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50,10 A 40,40 0 0 1 84.6,26.6" fill="none" stroke="#FF5F6D" stroke-width="12" stroke-linecap="round" />
            <path d="M 90,50 A 40,40 0 0 1 78.3,78.3" fill="none" stroke="#00B09B" stroke-width="12" stroke-linecap="round" />
            <path d="M 50,90 A 40,40 0 0 1 15.4,73.4" fill="none" stroke="#FFC371" stroke-width="12" stroke-linecap="round" />
            <path d="M 10,50 A 40,40 0 0 1 21.7,21.7" fill="none" stroke="#2193B0" stroke-width="12" stroke-linecap="round" />
        </svg>
        <h1 class="title">TripUp</h1>
        <h2 class="subtitle">Mobile App Redesign</h2>
    </div>
    <div class="right-col">
        <div class="phone-wrapper">
            <img src="Highfi.png" class="phone-img" alt="TripUp App Screenshot">
        </div>
    </div>
</body>
</html>
